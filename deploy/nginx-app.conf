# NegosyoWork Studio: the whole Vhost of the app site (Sites → APP_DOMAIN → Vhost), the
# address sellers open (e.g. app.example.com). Create it in CloudPanel as a Static HTML site.
# Replace the Vhost's contents with this, then replace APP_DOMAIN, SITE_USER (the API site's
# user) and DOMAIN (the API site's code folder under htdocs, e.g. api.example.com).
#
# It serves the built React app straight from the API site's code (frontend/dist), so one
# `git pull` + build updates both. Uploaded photos and sounds come from the API site (DOMAIN).

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name APP_DOMAIN;
  root /home/SITE_USER/htdocs/DOMAIN/frontend/dist;

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  include /etc/nginx/global_settings;

  # Built JS/CSS have a hash in their name, so they can be cached for a long time.
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Background-removal / face-tracking runtime and the built-in backdrops.
  location ~ ^/(mediapipe|backgrounds)/ {
    expires 30d;
    access_log off;
  }

  # Every other path is a page of the app: serve the file if it exists, else index.html
  # (never cached, so a new version shows up straight away).
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
