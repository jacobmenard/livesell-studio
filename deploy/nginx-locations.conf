# NegosyoWork Studio: Nginx rules for the CloudPanel site (Sites → your site → Vhost).
#
# Paste these INSIDE the main `server { ... }` block (the one with your domain, {{root}} and
# the `location ~ \.php$` block), in place of CloudPanel's default `location / { ... }` and its
# static-files block (`location ~* ^.+\.(css|js|jpg|...)$`). Keep everything else CloudPanel
# generated, especially the `location ~ \.php$` block.
#
# Replace SITE_USER and DOMAIN below with your CloudPanel site user and domain.
# The site's Root Directory (Settings) must be:  backend/public

# ---- Laravel: the API, login cookies, live-update sign-in, uploads -------------------------
location ^~ /api/ {
  try_files $uri /index.php?$query_string;
}

location ^~ /sanctum/ {
  try_files $uri /index.php?$query_string;
}

# Uploaded photos, sounds and receipts' public copies (php artisan storage:link).
location ^~ /storage/ {
  try_files $uri =404;
  expires 7d;
  access_log off;
}

# ---- Reverb: instant popups on the clean screen (WebSocket) ---------------------------------
location ^~ /app/ {
  proxy_pass http://127.0.0.1:6001;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "Upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 3600s;
}

# ---- Streaming relay: "stream straight to Facebook / YouTube" (WebSocket) -------------------
location ^~ /relay {
  proxy_pass http://127.0.0.1:8090;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "Upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  # A live can run for hours and sends video continuously.
  proxy_read_timeout 86400s;
  proxy_send_timeout 86400s;
  proxy_buffering off;
  client_max_body_size 0;
}

# ---- The React app (built into frontend/dist) -------------------------------------------------
# Built JS/CSS have a hash in their name, so they can be cached for a long time.
location ^~ /assets/ {
  root /home/SITE_USER/htdocs/DOMAIN/frontend/dist;
  expires 1y;
  add_header Cache-Control "public, immutable";
  access_log off;
}

# Background-removal / face-tracking runtime and the built-in backdrops.
location ^~ /mediapipe/ {
  root /home/SITE_USER/htdocs/DOMAIN/frontend/dist;
  expires 30d;
  access_log off;
}

location ^~ /backgrounds/ {
  root /home/SITE_USER/htdocs/DOMAIN/frontend/dist;
  expires 30d;
  access_log off;
}

# Every other path is a page of the app: serve the file if it exists, else index.html
# (never cached, so a new version shows up straight away).
location / {
  root /home/SITE_USER/htdocs/DOMAIN/frontend/dist;
  try_files $uri /index.html;
  add_header Cache-Control "no-cache";
}
