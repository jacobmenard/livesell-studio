# NegosyoWork Studio: Nginx rules for the CloudPanel site (Sites → your site → Vhost).
#
# CloudPanel's Vhost has two `server { ... }` blocks: the first one (listen 443) is what
# visitors reach; the second (listen 8080) is the backend for CloudPanel's Varnish cache.
#
# In the FIRST block only, delete:
#   - the `location / { {{varnish_proxy_pass}} ... }` block, and
#   - the static-files block that starts with `location ~* ^.+\.(css|js|jpg|...`,
# and paste everything below in their place. Leave the second (listen 8080) block as it is.
# Nothing goes through Varnish: Laravel answers directly, so it sees each visitor's real IP
# (sign-up and login limits are per visitor) and API answers are never cached.
#
# Replace SITE_USER and DOMAIN below with your CloudPanel site user and the folder holding
# the code under htdocs (e.g. example.com, or example.com/livesell-studio).
# The site's Root Directory (Settings) must be that folder followed by /backend/public.

# ---- Laravel: the API, login cookies, live-update sign-in ----------------------------------
location ^~ /api/ {
  try_files $uri /index.php?$query_string;
}

location ^~ /sanctum/ {
  try_files $uri /index.php?$query_string;
}

# Only Laravel's front controller runs as PHP; no other .php file can be executed.
location = /index.php {
  include fastcgi_params;
  fastcgi_param SCRIPT_FILENAME $document_root/index.php;
  fastcgi_param HTTPS "on";
  fastcgi_param SERVER_PORT 443;
  fastcgi_pass 127.0.0.1:{{php_fpm_port}};
  fastcgi_param PHP_VALUE "{{php_settings}}";
  fastcgi_read_timeout 3600;
  fastcgi_send_timeout 3600;
}

# Uploaded photos and sounds (php artisan storage:link).
location ^~ /storage/ {
  try_files $uri =404;
  expires 7d;
  access_log off;
}

# ---- Reverb: instant popups on the clean screen (WebSocket) ---------------------------------
location ^~ /app/ {
  proxy_pass http://127.0.0.1:6001;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "Upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 3600s;
}

# ---- Streaming relay: "stream straight to Facebook / YouTube" (WebSocket) -------------------
location ^~ /relay {
  proxy_pass http://127.0.0.1:8090;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "Upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  # A live can run for hours and sends video continuously.
  proxy_read_timeout 86400s;
  proxy_send_timeout 86400s;
  proxy_buffering off;
  client_max_body_size 0;
}

# ---- The React app (built into frontend/dist) -------------------------------------------------
# Built JS/CSS have a hash in their name, so they can be cached for a long time.
location ^~ /assets/ {
  root /home/SITE_USER/htdocs/DOMAIN/frontend/dist;
  expires 1y;
  add_header Cache-Control "public, immutable";
  access_log off;
}

# Background-removal / face-tracking runtime and the built-in backdrops.
location ^~ /mediapipe/ {
  root /home/SITE_USER/htdocs/DOMAIN/frontend/dist;
  expires 30d;
  access_log off;
}

location ^~ /backgrounds/ {
  root /home/SITE_USER/htdocs/DOMAIN/frontend/dist;
  expires 30d;
  access_log off;
}

# Every other path is a page of the app: serve the file if it exists, else index.html
# (never cached, so a new version shows up straight away).
location / {
  root /home/SITE_USER/htdocs/DOMAIN/frontend/dist;
  try_files $uri /index.html;
  add_header Cache-Control "no-cache";
}
