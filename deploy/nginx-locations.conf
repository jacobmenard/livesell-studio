# NegosyoWork Studio: Nginx rules for the API site (Sites → DOMAIN → Vhost).
# DOMAIN (e.g. api.example.com) runs Laravel, Reverb and the streaming relay; the app the
# sellers open is on its own site (APP_DOMAIN, deploy/nginx-app.conf).
#
# CloudPanel's Vhost has two `server { ... }` blocks: the first one (listen 443) is what
# visitors reach; the second (listen 8080) is the backend for CloudPanel's Varnish cache.
#
# In the FIRST block only, delete:
#   - the `location / { {{varnish_proxy_pass}} ... }` block, and
#   - the static-files block that starts with `location ~* ^.+\.(css|js|jpg|...`,
# and paste everything below in their place. Leave the second (listen 8080) block as it is.
# Nothing goes through Varnish: Laravel answers directly, so it sees each visitor's real IP
# (sign-up and login limits are per visitor) and API answers are never cached.
#
# The site's Root Directory (Settings) must be the code folder followed by /backend/public.

# ---- Laravel: the API, login cookies, live-update sign-in ----------------------------------
location / {
  try_files $uri /index.php?$query_string;
}

# Only Laravel's front controller runs as PHP; no other .php file can be executed.
location = /index.php {
  include fastcgi_params;
  fastcgi_param SCRIPT_FILENAME $document_root/index.php;
  fastcgi_param HTTPS "on";
  fastcgi_param SERVER_PORT 443;
  fastcgi_pass 127.0.0.1:{{php_fpm_port}};
  fastcgi_param PHP_VALUE "{{php_settings}}";
  fastcgi_read_timeout 3600;
  fastcgi_send_timeout 3600;
}

# Uploaded photos and sounds (php artisan storage:link), linked as https://DOMAIN/storage/...
# (PUBLIC_STORAGE_URL in backend/.env). The app on APP_DOMAIN downloads sounds to mix them
# into a live, which browsers only allow when the file says so (CORS). Sent on every answer,
# so a cached copy works too. These files are public anyway; no cookies are involved.
location ^~ /storage/ {
  try_files $uri =404;
  add_header Access-Control-Allow-Origin "*" always;
  expires 7d;
  access_log off;
}

# ---- Reverb: instant popups on the clean screen (WebSocket) ---------------------------------
location ^~ /app/ {
  proxy_pass http://127.0.0.1:6001;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "Upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 3600s;
}

# ---- Streaming relay: "stream straight to Facebook / YouTube" (WebSocket) -------------------
location ^~ /relay {
  proxy_pass http://127.0.0.1:8090;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "Upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  # A live can run for hours and sends video continuously.
  proxy_read_timeout 86400s;
  proxy_send_timeout 86400s;
  proxy_buffering off;
  client_max_body_size 0;
}
