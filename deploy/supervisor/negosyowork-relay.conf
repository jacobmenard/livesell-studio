; NegosyoWork Studio: the streaming relay (stream straight to Facebook / YouTube with FFmpeg).
; Copy to /etc/supervisor/conf.d/ and replace SITE_USER, DOMAIN and the Node path
; (run `which node` as the site user after installing Node 22 with nvm).
; It listens on 127.0.0.1 only; Nginx passes /relay to it over https. Settings come from relay/.env.
[program:negosyowork-relay]
command=/home/SITE_USER/.nvm/versions/node/v22.13.1/bin/node --env-file-if-exists=.env server.mjs
directory=/home/SITE_USER/htdocs/DOMAIN/relay
user=SITE_USER
environment=HOME="/home/SITE_USER"
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/home/SITE_USER/logs/negosyowork-relay.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
