; NegosyoWork Studio: Reverb (instant popups on the clean screen).
; Copy to /etc/supervisor/conf.d/ and replace SITE_USER and DOMAIN.
; It listens on 127.0.0.1 only; Nginx passes /app/ to it over https.
[program:negosyowork-reverb]
command=/usr/bin/php8.3 artisan reverb:start --host=127.0.0.1 --port=8080
directory=/home/SITE_USER/htdocs/DOMAIN/backend
user=SITE_USER
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/home/SITE_USER/logs/negosyowork-reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
