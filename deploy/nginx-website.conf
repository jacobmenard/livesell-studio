# NegosyoWork Studio: the whole Vhost of the website (Sites → WEBSITE_DOMAIN → Vhost), the
# public landing page (e.g. example.com). Create it in CloudPanel as a Static HTML site.
# Replace the Vhost's contents with this, then replace WEBSITE_DOMAIN, SITE_USER (the API
# site's user) and DOMAIN (the API site's code folder under htdocs, e.g. api.example.com).
#
# It serves website/ straight from the API site's code, so the usual `git pull`
# (deploy/deploy.sh) updates the website too. The Android APK sits in website/app/, which git
# ignores, so pulls never remove it.

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name WEBSITE_DOMAIN;
  root /home/SITE_USER/htdocs/DOMAIN/website;
  index index.html;

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  # Certificate renewals: CloudPanel puts Let's Encrypt's check file in this site's own folder.
  location ~ /.well-known {
    {{root}}
    auth_basic off;
    allow all;
  }

  {{settings}}

  include /etc/nginx/global_settings;

  # The folder's notes are for you, not for visitors.
  location ~* \.md$ {
    return 404;
  }

  # The Android app. Sent as an app to install, never cached, so a new upload shows at once.
  location ^~ /app/ {
    types { application/vnd.android.package-archive apk; }
    default_type application/octet-stream;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # The settings file changes when the download link does: always check for a new one.
  location = /assets/js/config.js {
    add_header Cache-Control "no-cache";
    access_log off;
  }

  # Styles, scripts and icons have no version in their names, so cache them for an hour only.
  location ^~ /assets/ {
    expires 1h;
    access_log off;
  }

  # The page itself is never cached, so changes show up straight away.
  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
  }
}
