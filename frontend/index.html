<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NegosyoWork Studio — your live-selling setup, ready in one tap." />
    <meta name="theme-color" content="#062B63" />
    <title>NegosyoWork Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500&display=swap"
    />
    <script>
      // Apply the saved Light/Dark choice before first paint (no flash of the wrong theme).
      try {
        var pref = localStorage.getItem('livesell.theme')
        if (pref === 'light' || pref === 'dark') document.documentElement.setAttribute('data-theme', pref)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
